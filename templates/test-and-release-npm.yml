# Vorlage für .github/workflows/test-and-release.yml eines Adapters, der über npm bzw. das ioBroker-Repository
# verteilt wird. Aufbau und Dateiname wie der ioBroker-Standard (check-and-lint, adapter-tests, deploy), damit der
# Repochecker ihn erkennt. Anpassen: default-branch, build (bei build: false auch in adapter-tests),
# extra-runtime-paths.
#
# Voraussetzungen im Adapter: kein "prepare"-Skript, common.nogit: true, höchstens 7 Einträge in common.news.
# Auf npmjs.com beim Paket unter Settings → Trusted publishing: GitHub Actions, Owner/Repository des Adapters,
# Workflow-Datei "test-and-release.yml". Pflicht-Check im Branch-Schutz: "check-and-lint / ci-result".
name: Test and Release

on:
    push:
        branches: [main]
        # Tags setzt der Release-Job selbst (mit GITHUB_TOKEN, löst keinen Lauf aus); ein von Hand gepushter Tag
        # startet nur die Prüfungen – released wird ausschließlich von main
        tags:
            # normal versions
            - 'v[0-9]+.[0-9]+.[0-9]+'
            # pre-releases
            - 'v[0-9]+.[0-9]+.[0-9]+-**'
    pull_request: {}
    schedule:
        # Wöchentlich mit voller Matrix (Linux + Windows, Node 22/24/26)
        - cron: '23 3 * * 1'
    workflow_dispatch:

# Neuer Push auf denselben Pull Request bricht den älteren Lauf ab; Läufe auf main laufen zu Ende,
# damit kein Release mittendrin abgebrochen wird
concurrency:
    group: ${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read

jobs:
    # Alle Prüfungen und das Release (zentraler Workflow); Pflicht-Check im Branch-Schutz: "check-and-lint / ci-result"
    check-and-lint:
        uses: Exc3pt10n/ioBroker-workflows/.github/workflows/adapter.yml@v1
        # Schreibrecht braucht nur der Release-Job (Tag, GitHub-Release)
        permissions:
            contents: write
        with:
            default-branch: main
            # TypeScript-Adapter: true (führt "npm run check" und "npm run build" aus)
            build: true
            # Das .tgz am GitHub-Release ist genau das Paket, das auf npm landet
            prebuilt-package: true
            # Verteilung über npm bzw. das ioBroker-Repository: kein "prepare", common.nogit, höchstens 7 news
            npm-package: true
            # Kein Branch "release": ohne Build im Repository lässt er sich nicht aus GitHub installieren
            release-branch: ''
            # Ausgelieferte Quellen, die nicht in "files" stehen (z. B. TypeScript unter src/)
            extra-runtime-paths: 'src/'

    # Unit- und Integrationstests mit der offiziellen ioBroker-Action (zusätzlich zu check-and-lint)
    adapter-tests:
        if: contains(github.event.head_commit.message, '[skip ci]') == false
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                node-version: [22.x, 24.x]
                os: [ubuntu-latest]
        steps:
            - uses: ioBroker/testing-action-adapter@d4c684a25df5a2a75d57a967fb19630eb4086f46 # v1
              with:
                  node-version: ${{ matrix.node-version }}
                  os: ${{ matrix.os }}
                  build: true

    # Nach einem Release: das Paket vom GitHub-Release auf npm veröffentlichen (Trusted Publishing, kein Token)
    deploy:
        needs: [check-and-lint, adapter-tests]
        if: needs.check-and-lint.outputs.released == 'true'
        uses: Exc3pt10n/ioBroker-workflows/.github/workflows/npm-publish.yml@v1
        permissions:
            contents: read
            id-token: write
        with:
            version: ${{ needs.check-and-lint.outputs.version }}
